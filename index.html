<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>O'NDE LUIGI — Pedidos y Control de Ventas</title>
    <meta
      name="description"
      content="Sistema interno O'NDE LUIGI para toma ágil de pedidos, personalización de recetas y salsas, comprobantes de transferencia y control de ventas."
    />
    <meta property="og:title" content="O'NDE LUIGI — Pedidos y Control de Ventas" />
    <meta
      property="og:description"
      content="Sistema interno O'NDE LUIGI para toma ágil de pedidos, personalización de recetas y salsas, comprobantes de transferencia y control de ventas."
    />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0A0A0A" />
    <link rel="icon" type="image/png" href="./onde-luigi-logo.png" />
    <script>
      // Root "/" is strictly a router gateway (no manifest and no root-scoped Service Worker)
      // so /pos/ and /autoservicio/ install as 100% independent PWAs with non-overlapping scopes.
      (function () {
        var pathname = window.location.pathname || '/';
        var search = window.location.search || '';
        var hash = window.location.hash || '';
        var params = new URLSearchParams(search);
        var hashLower = hash.toLowerCase();
        var baseDir = pathname.endsWith('/')
          ? pathname
          : pathname.slice(0, pathname.lastIndexOf('/') + 1);
        if (/\/admin\/?$/i.test(baseDir)) {
          baseDir = baseDir.replace(/\/admin\/?$/i, '/');
        }
        if (/\/pos\/?$/i.test(baseDir)) {
          baseDir = baseDir.replace(/\/pos\/?$/i, '/');
        }
        if (/\/autoservicio\/?$/i.test(baseDir)) {
          baseDir = baseDir.replace(/\/autoservicio\/?$/i, '/');
        }

        if (
          params.get('autoservicio') === '1' ||
          hashLower.indexOf('#/autoservicio') === 0 ||
          /\/autoservicio(\/|$)/i.test(pathname)
        ) {
          var pedido = (params.get('pedido') || '').trim();
          var safePedido = /^[a-zA-Z0-9_-]{1,128}$/.test(pedido)
            ? '?pedido=' + encodeURIComponent(pedido)
            : '';
          window.location.replace(baseDir + 'autoservicio/' + safePedido);
          return;
        }

        if (/\/admin\/pagos\/?$/i.test(pathname) || hashLower.indexOf('#/admin/pagos') === 0) {
          params.set('tab', 'datos_pago');
          var nextQuery = params.toString();
          window.location.replace(baseDir + 'pos/' + (nextQuery ? '?' + nextQuery : ''));
          return;
        }

        window.location.replace(baseDir + 'pos/' + search + hash);
      })();
    </script>
  </head>
  <body class="bg-[#0A0A0A] text-white antialiased min-h-screen flex items-center justify-center p-6">
    <main class="text-center space-y-4 max-w-sm">
      <p class="text-lg font-extrabold tracking-wide">O&apos;NDE LUIGI</p>
      <p class="text-xs text-zinc-400">Redirigiendo a la aplicación correspondiente...</p>
      <div class="flex items-center justify-center gap-3 pt-1">
        <a
          href="./pos/"
          class="px-4 py-2 rounded-xl bg-amber-500 text-black text-xs font-bold"
        >
          Abrir POS
        </a>
        <a
          href="./autoservicio/"
          class="px-4 py-2 rounded-xl border border-zinc-700 bg-zinc-900 text-zinc-200 text-xs font-semibold"
        >
          Abrir Autoservicio
        </a>
      </div>
    </main>
  </body>
</html>
