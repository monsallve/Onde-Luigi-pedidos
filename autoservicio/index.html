<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Enforce canonical trailing slash on /autoservicio/ and capture beforeinstallprompt before async JS hydration
      (function () {
        var p = window.location.pathname;
        if (/\/autoservicio$/i.test(p)) {
          window.location.replace(p + '/' + window.location.search + window.location.hash);
          return;
        }
        window.__ondeluigiDeferredInstallPrompt = null;
        window.addEventListener('beforeinstallprompt', function (e) {
          e.preventDefault();
          window.__ondeluigiDeferredInstallPrompt = e;
          window.dispatchEvent(new CustomEvent('ondeluigi:beforeinstallprompt-captured'));
        });
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>O'NDE LUIGI · Autoservicio</title>
    <meta
      name="description"
      content="Pide en línea en O'NDE LUIGI: arma tu pedido con tus salsas e ingredientes favoritos, elige recoger o domicilio y sigue tu turno en vivo."
    />
    <meta property="og:title" content="O'NDE LUIGI · Autoservicio" />
    <meta
      property="og:description"
      content="Pide en línea en O'NDE LUIGI, adjunta tu comprobante digital y sigue tu turno en tiempo real."
    />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0A0A0A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Luigi Pide" />
    <link
      id="app-pwa-manifest"
      rel="manifest"
      href="/manifest-autoservicio.webmanifest"
      crossorigin="use-credentials"
    />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="./pwa-192x192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#0A0A0A] text-white antialiased selection:bg-amber-500/30 selection:text-amber-200">
    <div id="root"></div>
    <script type="module" src="/src/autoservicio-main.tsx"></script>
  </body>
</html>
